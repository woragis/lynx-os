name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lynx
          POSTGRES_PASSWORD: lynx-test
          POSTGRES_DB: lynx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynx -d lynx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LYNX_TEST_DATABASE_URL: postgres://lynx:lynx-test@localhost:5432/lynx_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply PostgreSQL migrations
        run: for migration in migrations/*.up.sql; do psql "$LYNX_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Go tests including PostgreSQL integration
        run: cd backend && go test ./...
      - run: npm run test:integration
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
