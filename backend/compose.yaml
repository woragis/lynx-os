services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lynx_os
      POSTGRES_USER: lynx
      POSTGRES_PASSWORD: lynx_dev_only
    ports:
      - "5433:5432"
    volumes:
      - lynx_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynx -d lynx_os"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  lynx_postgres:
